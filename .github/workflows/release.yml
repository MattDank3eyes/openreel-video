name: Package OBSTcut AppImage

# Builds a standalone Linux x64 AppImage and does not upload it anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build AppImage without publishing
        working-directory: apps/desktop
        run: pnpm run dist:linux
