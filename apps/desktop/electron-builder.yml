appId: stream.offbrandstreamertools.obstcut
productName: OBSTcut
executableName: OBSTcut
artifactName: ${productName}-${version}-${arch}.${ext}
asar: true
directories:
  output: release
extraFiles:
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../THIRD_PARTY_NOTICES
    to: THIRD_PARTY_NOTICES
files:
  - dist/**/*
  - renderer/**/*
  - assets/**/*
  - package.json
linux:
  icon: assets/icon.png
  target:
    - target: AppImage
      arch: [x64]
  category: AudioVideo
