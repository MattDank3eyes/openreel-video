name: Perf Gate

# The previous web and desktop perf budgets targeted the removed editor.
# This workflow stays scheduled so the cron does not fail, and it does not run those gates.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skipped:
    name: Perf gates not configured
    runs-on: ubuntu-latest
    steps:
      - run: echo "No perf gate is configured for OBSTcut."
