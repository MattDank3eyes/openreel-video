name: Desktop Readiness

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/obstcut/**'
      - '.github/workflows/desktop-readiness.yml'
  push:
    branches: [feat/ios-app, main]
    paths:
      - 'apps/desktop/**'
      - 'apps/obstcut/**'
      - '.github/workflows/desktop-readiness.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck desktop
        run: pnpm --filter @obstcut/desktop typecheck
      - name: Test desktop
        run: pnpm --filter @obstcut/desktop test:run
